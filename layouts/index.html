{{ define "main" }}
<h2>Archive by Year</h2>
<year-grid>
    {{- range .Site.Params.years }}
    <year-card>
        <a href="{{ printf "%s/" . | relURL }}">
            <year-number>{{ . }}</year-number>
            <year-arrow>→</year-arrow>
        </a>
    </year-card>
    {{- end }}
</year-grid>
{{ end }}
